[project]
name = "calorie-vision"
version = "0.1.0"
description = "Personal calorie tracking app with AI-powered food image analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "pytest>=8.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "alembic>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=0.25.0",
]
