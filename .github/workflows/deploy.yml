name: Deploy to Self-Hosted Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Restart Docker Containers
        run: |
          # 1. Copy the persistent .env file from your server into the runner's workspace
          cp /home/Bunny/VSSD/home/vishal/self-hosting/calorie-vision.env .
          
          # 2. Rebuild using the freshly checked-out code
          docker compose up --build -d
          
          # 3. Clean up old dangling images
          docker image prune -f
