services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calorievision
      POSTGRES_PASSWORD: calorievision
      POSTGRES_DB: calorievision
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorievision -d calorievision"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    ports:
      - "9670:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://calorievision:calorievision@db:5432/calorievision
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
